<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>コンサルする側の振り返り</title>
<link rel="stylesheet" href="style.css">
</head>
<body><div class="wrap">
<h1>公嗣さんの振り返り</h1>
<p class="lead" id="sub">コンサルする側の成長を柱に刻む3分です。</p>
<div class="q" id="keyBox">
  <b>合言葉</b>
  <input type="password" id="key" placeholder="合言葉" autocomplete="current-password">
  <button id="keyBtn">ひらく</button>
  <div class="msg" id="keyMsg"></div>
</div>
<form id="f" class="hide">
  <div class="q">
    <b>今日のコンサルで<span class="req">必須</span></b>
    <p class="hint">0＝まったくできなかった、10＝とてもできた</p>
    <div id="K"></div>
  </div>
  <div class="q">
    <b>相手は今日の「全体として」に何点を付けると思う？<span class="req">必須</span></b>
    <p class="hint">相手のアンケートと並べて、見立てのずれを見ます。</p>
    <div class="scale s11" id="guess"></div>
  </div>
  <div class="q">
    <b>いちばん効いた問い<span class="opt">任意</span></b>
    <input type="text" name="効いた問い" placeholder="例：それを誰に、いつまでにやりますか？">
  </div>
  <div class="q">
    <b>次のコンサルで変えることを1つ<span class="req">必須</span></b>
    <input type="text" name="次に変えること" placeholder="例：質問したら5秒待つ">
  </div>
  <div class="q">
    <b>ひとこと（気づき・もやもや）<span class="opt">任意</span></b>
    <textarea name="ひとこと"></textarea>
  </div>
  <button type="submit" id="send">記録する</button>
  <div class="msg" id="msg"></div>
</form>
<div id="thanks" class="hide" style="text-align:center;padding:40px 10px">
  <h2>記録しました！</h2>
  <p>お楽しみ様でした。<a href="kiroku.html">成長の記録を見る →</a></p>
</div>
<footer>ありがとうグループ 個別コンサル（三浦さん専用）</footer>
</div>
<script src="common.js"></script>
<script>
const sid = new URLSearchParams(location.search).get("s") || "";
const K_ITEMS = [["K1", "相手の話を最後まで聞けた"], ["K2", "相手が本当に扱いたいことを扱えた"], ["K3", "問いで、相手が自分で考えて自分で決めた"], ["K4", "準備と時間の使い方"]];
let KEY = "";
$("#key").value = store("consultKey");
async function open_() {
  KEY = $("#key").value.trim();
  try {
    const j = await apiGet({ a: "session", s: sid });
    if (!j.ok) throw new Error("この回が見つかりませんでした");
    $("#sub").textContent = `${j.name}　${md(j.date)}　第${j.n}回`;
    $("#K").innerHTML = K_ITEMS.map(([k, l]) => `<div class="sub-q"><span>${esc(l)}</span><div class="scale s11">${scale(k, 0, 10)}</div></div>`).join("");
    $("#guess").innerHTML = scale("相手の現在地予想", 0, 10);
    store("consultKey", KEY); $("#keyBox").classList.add("hide"); $("#f").classList.remove("hide");
  } catch (e) { $("#keyMsg").className = "msg ng"; $("#keyMsg").textContent = e.message; }
}
$("#keyBtn").onclick = open_;
if ($("#key").value) open_();
$("#f").onsubmit = async ev => {
  ev.preventDefault();
  const fd = new FormData($("#f")), v = k => (fd.get(k) || "").toString().trim(), a = {};
  K_ITEMS.forEach(([k]) => a[k] = v(k)); ["相手の現在地予想", "効いた問い", "次に変えること", "ひとこと"].forEach(k => a[k] = v(k));
  if (K_ITEMS.some(([k]) => a[k] === "") || a["相手の現在地予想"] === "" || !a["次に変えること"]) { $("#msg").className = "msg ng"; $("#msg").textContent = "必須のところがまだです"; return; }
  $("#send").disabled = true; $("#msg").className = "msg"; $("#msg").textContent = "記録しています…";
  const j = await apiPost({ type: "coach", key: KEY, sid, a });
  if (!j.ok) { $("#send").disabled = false; $("#msg").className = "msg ng"; $("#msg").textContent = j.error === "key" ? "合言葉がちがいます" : "記録できませんでした"; return; }
  $("#f").classList.add("hide"); $("#thanks").classList.remove("hide"); scrollTo(0, 0);
};
</script>
</body></html>
