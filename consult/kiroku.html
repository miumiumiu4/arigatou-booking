<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>コンサル 成長の記録</title>
<link rel="stylesheet" href="style.css">
<style>
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.5rem;line-height:1.25}.tile span{font-size:.78rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
.card h3{margin:0;font-size:1rem}.card .meta{color:var(--muted);font-size:.82rem}
.card dl{margin:8px 0 0}.card dt{font-size:.78rem;color:var(--muted);margin-top:6px}.card dd{margin:0;white-space:pre-wrap}
.todo{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding:8px 0;font-size:.92rem}.todo:first-of-type{border-top:0}
.todo .btn,.todo button{width:auto;margin:0;padding:6px 12px;font-size:.85rem}
.sig{font-weight:700}.sig.赤{color:var(--ng)}.sig.黄{color:#b8860b}.sig.緑{color:var(--ok)}
.karte{white-space:pre-wrap;font-size:.93rem;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{border-bottom:1px solid var(--line);padding:4px;text-align:center}
</style>
</head>
<body><div class="wrap">
<h1>個別コンサル 成長の記録</h1>
<div class="q" id="keyBox">
  <b>合言葉</b>
  <input type="password" id="key" placeholder="合言葉" autocomplete="current-password">
  <button id="keyBtn">ひらく</button>
  <div class="msg" id="keyMsg"></div>
</div>
<div id="main" class="hide">
  <div class="chips" id="people"></div>
  <div id="body"></div>
  <p style="text-align:center"><a href="nyuryoku.html">← コンサルの記録をつける</a></p>
</div>
<footer>ありがとうグループ 個別コンサル（三浦さん専用）</footer>
</div>
<script src="common.js"></script>
<script>
let R = null, KEY = "";
$("#key").value = store("consultKey");
const SIG = { "赤": "🔴 要フォロー", "黄": "🟡 様子を見る", "緑": "🟢 順調" };
const A_SER = [["A1", "var(--c1)", "仕事・事業"], ["A2", "var(--c2)", "心の状態"], ["A3", "var(--c3)", "人間関係"], ["A4", "var(--c4)", "全体"]];
async function load() {
  const j = await apiGet({ a: "records", key: KEY });
  if (!j.ok) throw new Error(j.error === "key" ? "合言葉がちがいます" : j.error);
  R = j;
}
async function open_() {
  KEY = $("#key").value.trim(); $("#keyMsg").className = "msg"; $("#keyMsg").textContent = "読みこみ中…";
  try {
    await load(); store("consultKey", KEY);
    $("#keyBox").classList.add("hide"); $("#main").classList.remove("hide");
    $("#people").innerHTML = R.people.map(p => `<label><input type="radio" name="p" value="${esc(p.id)}">${esc(p["お名前"])}</label>`).join("") + `<label><input type="radio" name="p" value="__coach">公嗣さん（する側）</label>`;
    document.querySelectorAll("input[name=p]").forEach(r => r.onchange = () => draw(r.value));
    const first = document.querySelector("input[name=p]"); if (first) { first.checked = true; draw(first.value); }
  } catch (e) { $("#keyMsg").className = "msg ng"; $("#keyMsg").textContent = e.message; }
}
$("#keyBtn").onclick = open_;
if ($("#key").value) open_();

const lastBySid = list => { const o = {}; list.forEach(a => o[a.sid] = a); return Object.values(o); };
const lineText = (name, link) => "https://line.me/R/msg/text/?" + encodeURIComponent(`${name}、今日はお楽しみ様でした！\n今日のふりかえりアンケートです（3分ほど）。\n${link}\n\n愛してるぜ🤟`);
function draw(pid) { if (pid === "__coach") return drawCoach(); drawPerson(pid); }

function drawPerson(pid) {
  const P = R.people.find(p => p.id === pid);
  const A = lastBySid(R.answers.filter(a => a["人id"] === pid)).sort((x, y) => (+x["回数"] || 0) - (+y["回数"] || 0) || String(x["実施日"]).localeCompare(y["実施日"]));
  const ses = R.sessions.filter(s => s["人id"] === pid).sort((x, y) => String(y["実施日"]).localeCompare(x["実施日"]));
  const kar = R.karte.filter(k => k["人id"] === pid).sort((x, y) => String(y["実施日"]).localeCompare(x["実施日"]));
  const reps = R.reports.filter(r => r["人id"] === pid);
  const first = R.first.filter(f => f["人id"] === pid).pop();
  const answered = new Set(A.map(a => a.sid)), coached = new Set(R.coach.map(c => c.sid));
  const vows = A.filter(a => a["B結果"]);
  const rate = vows.length ? Math.round(vows.reduce((s, a) => s + ({ "やれた": 1, "一部": .5 }[a["B結果"]] || 0), 0) / vows.length * 100) + "%" : "—";
  const nowA = A.length ? num(A[A.length - 1].A4) : null, startA = first ? num(first.A4) : (A.length ? num(A[0].A4) : null);
  const sig = kar[0] ? kar[0]["信号"] : "";
  let h = `<div class="tiles">
    <div class="tile"><b>${A.length}</b><span>答えた回</span></div>
    <div class="tile"><b>${rate}</b><span>前回の約束の実行率</span></div>
    <div class="tile"><b>${nowA == null ? "—" : nowA}</b><span>いまの「全体」（0〜10）${startA != null ? `<br>はじめは ${startA}` : ""}</span></div>
    <div class="tile"><b class="sig ${esc(sig)}" style="font-size:1rem;padding:.4em 0">${esc(SIG[sig] || "—")}</b><span>最新のカルテの信号</span></div></div>`;
  // やること
  const todos = [];
  if (!P["開始日"]) todos.push(`<div class="todo"><span>はじめのシートがまだ（スタート地点とゴールの記録）</span><a class="btn sub" href="nyuryoku.html">リンクを作る</a></div>`);
  ses.forEach(s => {
    const link = new URL("a.html?s=" + s.sid, location.href).href;
    if (s["状態"] === "準備完了" && !answered.has(s.sid)) todos.push(`<div class="todo"><span>${md(s["実施日"])} のアンケートを送る</span><a class="btn" target="_blank" rel="noopener" href="${lineText(P["お名前"], link)}">LINEで送る</a></div>`);
    else if (s["状態"] !== "準備完了") todos.push(`<div class="todo"><span>${md(s["実施日"])} 書き起こしを読んで準備中</span><span class="tag">待ち</span></div>`);
    if (!coached.has(s.sid)) todos.push(`<div class="todo"><span>${md(s["実施日"])} 公嗣さんの振り返り</span><a class="btn sub" href="coach.html?s=${esc(s.sid)}">つける</a></div>`);
  });
  reps.filter(r => r["状態"] !== "承認済み").forEach(r => todos.push(`<div class="todo"><span>第${esc(r["回数"])}回までの成長レポート（下書き）</span><span><a class="btn sub" target="_blank" href="report.html?r=${esc(r.rid)}&preview=1">見る</a> <button data-rid="${esc(r.rid)}">承認</button></span></div>`));
  reps.filter(r => r["状態"] === "承認済み").forEach(r => {
    const link = new URL("report.html?r=" + r.rid, location.href).href;
    todos.push(`<div class="todo"><span>第${esc(r["回数"])}回までの成長レポート（承認ずみ${r["成長を実感(0-10)"] !== "" ? "・実感 " + esc(r["成長を実感(0-10)"]) : ""}）</span><a class="btn sub" target="_blank" rel="noopener" href="https://line.me/R/msg/text/?${encodeURIComponent(`${P["お名前"]}、ここまでの成長レポートができました！\n${link}\n\n愛してるぜ🤟`)}">LINEで送る</a></div>`);
  });
  if (todos.length) h += `<div class="card"><h3>やること</h3>${todos.join("")}</div>`;
  if (A.length) {
    const rows = (first ? [Object.assign({ "回数": "はじめ" }, first)] : []).concat(A);
    h += `<h2>現在地の変化（0〜10）</h2>${legend(A_SER)}<div class="chart" id="c1"></div>
      <h2>今日の時間（4項目の合計、0〜40）</h2><div class="chart" id="c2"></div>
      <details><summary class="hint" style="cursor:pointer">表で見る</summary><table><tr><th>回</th><th>仕事</th><th>心</th><th>人間関係</th><th>全体</th><th>約束</th><th>時間</th></tr>
      ${A.map(a => `<tr><td>${esc(a["回数"])}</td><td>${esc(a.A1)}</td><td>${esc(a.A2)}</td><td>${esc(a.A3)}</td><td>${esc(a.A4)}</td><td>${esc(a["B結果"] || "—")}</td><td>${gsum(a) ?? "—"}</td></tr>`).join("")}</table></details>`;
  } else h += `<p class="lead">まだ回答がありません。</p>`;
  if (kar.length) h += `<h2>カルテ（新しい順）</h2>` + kar.map(k => `<div class="card"><h3>${md(k["実施日"])}　<span class="sig ${esc(k["信号"])}">${esc(SIG[k["信号"]] || "")}</span></h3><div class="karte">${esc(k["カルテ"])}</div></div>`).join("");
  if (A.length) h += `<h2>本人のふりかえり（新しい順）</h2>` + A.slice().reverse().map(a => `<div class="card"><h3>第${esc(a["回数"])}回　${md(a["実施日"])}</h3><dl>
      ${a["B結果"] ? `<dt>前回の約束</dt><dd>${esc(a["B結果"])}（最善 ${esc(a["B最善"])}）</dd>` : ""}
      <dt>小さな勝ち</dt><dd>${esc(a["C小さな勝ち"])}</dd><dt>気づき</dt><dd>${esc(a["D気づき"])}</dd><dt>次の一歩</dt><dd>${esc(a["D次の一歩"])}</dd>
      ${a["Eまだ"] ? `<dt>まだできていないこと</dt><dd>${esc(a["Eまだ"])}</dd>` : ""}${a["G要望"] ? `<dt>もっとこうしてほしい</dt><dd>${esc(a["G要望"])}</dd>` : ""}
      ${a["R変わったこと"] ? `<dt>3回前と比べて</dt><dd>${esc(a["R変わったこと"])}</dd><dt>強みが出た場面</dt><dd>${esc(a["R強みの場面"])}</dd>` : ""}</dl></div>`).join("");
  $("#body").innerHTML = h;
  if (A.length) {
    const rows = (first ? [Object.assign({ "回数": "はじめ" }, first)] : []).concat(A);
    lineChart($("#c1"), rows, A_SER, 0, 10, r => r["回数"] === "はじめ" ? "はじめ" : `第${r["回数"]}回`);
    lineChart($("#c2"), A, [[gsum, "var(--c2)", "合計"]], 0, 40, r => `第${r["回数"]}回`);
  }
  $("#body").querySelectorAll("button[data-rid]").forEach(bt => bt.onclick = async () => {
    if (!confirm("このレポートを承認しますか？承認すると、本人が登録したメールアドレスに成長レポートが届きます。")) return;
    bt.disabled = true; const j = await apiPost({ type: "approve", key: KEY, rid: bt.dataset.rid });
    if (j.ok) { alert(j.mailed ? `${j.mailed} にお送りしました。` : "メールアドレスが未登録のため、メールは送っていません。「LINEで送る」から届けてください。"); await load(); drawPerson(pid); } else bt.disabled = false;
  });
}
function gsum(a) { const v = ["G1", "G2", "G3", "G4"].map(k => num(a[k])); return v.some(x => x == null) ? null : v.reduce((s, x) => s + x, 0); }

function drawCoach() {
  const C = lastBySid(R.coach).sort((x, y) => String(x["実施日"]).localeCompare(y["実施日"]));
  const ans = {}; lastBySid(R.answers).forEach(a => ans[a.sid] = a);
  const ex = {}; R.extracts.forEach(e => { try { ex[e.sid] = JSON.parse(e["講師(JSON)"] || "{}"); } catch (_) {} });
  const rows = C.map(c => Object.assign({}, c, { G4: ans[c.sid] ? ans[c.sid].G4 : "", talk: (ex[c.sid] || {})["話す割合"], qs: (ex[c.sid] || {})["質問の数"] }));
  const K_SER = [["K1", "var(--c1)", "聞けた"], ["K2", "var(--c2)", "扱いたいこと"], ["K3", "var(--c3)", "自分で決めた"], ["K4", "var(--c4)", "準備・時間"]];
  let h = `<div class="tiles"><div class="tile"><b>${C.length}</b><span>振り返りをつけた回</span></div>
    <div class="tile"><b>${C.length ? esc(C[C.length - 1]["次に変えること"]) : "—"}</b><span>いま意識していること</span></div></div>`;
  if (!C.length) { $("#body").innerHTML = h + `<p class="lead">まだ記録がありません。コンサルのあと「記録をつくる」→「公嗣さんの振り返り」から付けられます。</p>`; return; }
  h += `<h2>自分の手ごたえ（0〜10）</h2>${legend(K_SER)}<div class="chart" id="k1"></div>
    <h2>見立てのずれ（相手の「全体」：予想と実際）</h2>${legend([["相手の現在地予想", "var(--c1)", "予想"], ["G4", "var(--c2)", "実際"]])}<div class="chart" id="k2"></div>`;
  if (rows.some(r => r.talk != null && r.talk !== "")) h += `<h2>書き起こしから：公嗣さんが話していた割合（%）</h2><div class="chart" id="k3"></div>`;
  h += `<h2>振り返り（新しい順）</h2>` + rows.slice().reverse().map(c => `<div class="card"><h3>${md(c["実施日"])}　${esc(c["お名前"])}</h3><dl>
    <dt>次に変えること</dt><dd>${esc(c["次に変えること"])}</dd>${c["効いた問い"] ? `<dt>効いた問い</dt><dd>${esc(c["効いた問い"])}</dd>` : ""}
    ${c.qs != null && c.qs !== "" ? `<dt>書き起こしから</dt><dd>話した割合 ${esc(c.talk)}%・質問 ${esc(c.qs)}回${(ex[c.sid] || {})["ひとこと"] ? "\n" + esc(ex[c.sid]["ひとこと"]) : ""}</dd>` : ""}
    ${c["ひとこと"] ? `<dt>ひとこと</dt><dd>${esc(c["ひとこと"])}</dd>` : ""}</dl></div>`).join("");
  $("#body").innerHTML = h;
  const xl = r => md(r["実施日"]);
  lineChart($("#k1"), rows, K_SER, 0, 10, xl);
  lineChart($("#k2"), rows, [["相手の現在地予想", "var(--c1)", "予想"], ["G4", "var(--c2)", "実際"]], 0, 10, xl);
  if ($("#k3")) lineChart($("#k3"), rows, [["talk", "var(--c1)", "話した割合"]], 0, 100, xl);
}
</script>
</body></html>
