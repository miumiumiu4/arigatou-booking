<!DOCTYPE html>

<title>Bring the Arigatou System to your country</title>
<!--

  ・まだどこからもリンクしない。登録ボタンを押しても何も送らない（SEND_URL が空の間は見本の動き）。
  ・配信の道具が決まったら SEND_URL に登録先を入れる（設計：Claude Doc「海外導入ナーチャリング 全体設計」）。
  ・英語が元。ほかの13言語は機械で作った下書きなので、公開の前にその言葉が分かる人が読む。
-->
<style>
  :root { --ink:#1f2328; --muted:#5b6470; --accent:#06c755; --accent-dark:#05a647; --bar:#2b3a55; --bg:#eef2f8; --line:#d9dee6; --warn-bg:#fff4d6; --warn-text:#6b4e00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans", sans-serif; color: var(--ink); background: var(--bg); font-size: 17px; line-height: 1.6; min-height: 100vh; }
  header { background: var(--bar); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header b { font-size: 16px; }
  header select { font-size: 15px; border-radius: 999px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.6); background: var(--bar); color: #fff; max-width: 50%; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .draft { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 16px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 8px 0 10px; }
  .sub { font-size: 18px; margin: 0 0 16px; }
  ul.get { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 8px; }
  ul.get li { background: #fff; border-radius: 12px; padding: 10px 14px; border: 1px solid var(--line); }
  ul.get li b { color: var(--accent-dark); margin-inline-end: 6px; }
  form { background: #fff; border-radius: 16px; padding: 18px 16px; border: 1px solid var(--line); display: grid; gap: 14px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
  input[type=email], input[type=text], select.f { font: inherit; padding: 12px; border: 1px solid #b9c1cc; border-radius: 10px; width: 100%; background: #fff; color: var(--ink); }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; }
  .agree input { width: 22px; height: 22px; margin-top: 2px; flex: 0 0 auto; }
  button.go { font: inherit; font-weight: 700; font-size: 19px; color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 14px; cursor: pointer; }
  button.go:active { background: var(--accent-dark); }
  .note { color: var(--muted); font-size: 14px; margin: 14px 2px 0; }
  .done { background: #fff; border-radius: 16px; padding: 22px 16px; border: 2px solid var(--accent); font-size: 18px; }
  .err { color: #b3261e; font-size: 14px; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b>Arigatou System</b>
  <select id="lang" aria-label="Language"></select>
</header>
<main>
  <div class="draft" id="draft">Draft page. Nothing is sent yet.（下書き。登録ボタンを押しても、まだ何も送りません）</div>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>
  <ul class="get">
    <li><b>1</b><span data-t="g1"></span></li>
    <li><b>2</b><span data-t="g2"></span></li>
    <li><b>3</b><span data-t="g3"></span></li>
  </ul>
  <form id="f" novalidate>
    <label><span data-t="email"></span><input type="email" id="email" autocomplete="email" inputmode="email" required></label>
    <label><span data-t="country"></span><input type="text" id="country" autocomplete="country-name" required></label>
    <label><span data-t="work"></span>
      <select class="f" id="work">
        <option value="run" data-t="w1"></option>
        <option value="plan" data-t="w2"></option>
        <option value="other" data-t="w3"></option>
      </select>
    </label>
    <label class="agree"><input type="checkbox" id="agree"><span data-t="agree"></span></label>
    <p class="err" id="err" hidden></p>
    <button class="go" type="submit" data-t="btn"></button>
  </form>
  <div class="done" id="done" hidden data-t="done"></div>
  <p class="note" data-t="note"></p>
  <p class="note" id="engonly" hidden data-t="engonly"></p>
</main>

  var sel = document.getElementById('lang');
  Object.keys(NAMES).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = NAMES[k]; sel.appendChild(o); });

  function pick() {
    var q = new URLSearchParams(location.search).get('lang');
    var cands = (q ? [q] : []).concat(navigator.languages || [navigator.language || 'en']);
    for (var i = 0; i < cands.length; i++) {
      var c = String(cands[i]);
      if (T[c]) return c;
      var low = c.toLowerCase();
      if (low.indexOf('zh') === 0) return /tw|hk|hant/.test(low) ? 'zh-TW' : 'zh-CN';
      if (low.indexOf('pt') === 0) return 'pt-BR';
      if (low === 'fil') return 'tl';
      var base = low.split('-')[0];
      if (T[base]) return base;
    }
    return 'en';
  }

  var cur = 'en';
  function apply(l) {
    cur = T[l] ? l : 'en';
    var t = T[cur];
    document.documentElement.lang = cur;
    document.title = t.title;
    sel.value = cur;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t[el.getAttribute('data-t')] || T.en[el.getAttribute('data-t')]; });
    document.getElementById('engonly').hidden = cur === 'en';
    document.getElementById('err').hidden = true;
  }
  sel.addEventListener('change', function () { apply(sel.value); });
  apply(pick());

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = T[cur], err = document.getElementById('err');
    var mail = document.getElementById('email').value.trim();
    var country = document.getElementById('country').value.trim();
    var msg = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) ? t.e_mail : !country ? t.e_country : !document.getElementById('agree').checked ? t.e_agree : '';
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    err.hidden = true;
    // SEND_URL が空の間は、何も送らずに「登録できた時の画面」だけ見せる
    if (SEND_URL) {
      var src = new URLSearchParams(location.search).get('from') || 'page';
      fetch(SEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: mail, country: country, lang: cur, work: document.getElementById('work').value, from: src, agreed: true }) }).catch(function () {});
    }
    document.getElementById('f').hidden = true;
    document.getElementById('done').hidden = false;
    document.getElementById('done').scrollIntoView({ block: 'center' });
  });
})();
