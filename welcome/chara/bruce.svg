  <circle cx="158" cy="98" r="9" fill="#3a2e28"/>
  <circle cx="161" cy="94" r="3" fill="#fff"/>
  <path d="M144 89 q18 -11 36 0" fill="#e9cdb0" stroke="#3a2e28" stroke-width="4" stroke-linecap="round"/>
