    <circle cx="247.2" cy="68.9" r="17" fill="#fff" stroke="#2a9d6a" stroke-width="3.5"/><text x="247.2" y="69.4" font-size="22" fill="#2a9d6a">$</text>
    <circle cx="255.0" cy="124.0" r="17" fill="#fff" stroke="#d6453d" stroke-width="3.5"/><text x="255.0" y="124.5" font-size="22" fill="#d6453d">¥</text>
    <circle cx="231.9" cy="175.9" r="17" fill="#fff" stroke="#7a4fc9" stroke-width="3.5"/><text x="231.9" y="176.4" font-size="22" fill="#7a4fc9">₩</text>
    <circle cx="183.2" cy="212.7" r="17" fill="#fff" stroke="#2f6fd0" stroke-width="3.5"/><text x="183.2" y="213.2" font-size="22" fill="#2f6fd0">₫</text>
    <circle cx="120.0" cy="226.0" r="17" fill="#fff" stroke="#e0a21b" stroke-width="3.5"/><text x="120.0" y="226.5" font-size="17" fill="#e0a21b">रू</text>
    <circle cx="56.8" cy="212.7" r="17" fill="#fff" stroke="#2a9d6a" stroke-width="3.5"/><text x="56.8" y="213.2" font-size="22" fill="#2a9d6a">₱</text>
    <circle cx="8.1" cy="175.9" r="17" fill="#fff" stroke="#d6453d" stroke-width="3.5"/><text x="8.1" y="176.4" font-size="17" fill="#d6453d">Rp</text>
    <circle cx="-15.0" cy="124.0" r="17" fill="#fff" stroke="#7a4fc9" stroke-width="3.5"/><text x="-15.0" y="124.5" font-size="22" fill="#7a4fc9">฿</text>
    <circle cx="-7.2" cy="68.9" r="17" fill="#fff" stroke="#2f6fd0" stroke-width="3.5"/><text x="-7.2" y="69.4" font-size="17" fill="#2f6fd0">R$</text>
    <circle cx="29.8" cy="23.2" r="17" fill="#fff" stroke="#e0a21b" stroke-width="3.5"/><text x="29.8" y="23.7" font-size="22" fill="#e0a21b">₽</text>
    <circle cx="87.5" cy="-2.6" r="17" fill="#fff" stroke="#2a9d6a" stroke-width="3.5"/><text x="87.5" y="-2.1" font-size="22" fill="#2a9d6a">元</text>
