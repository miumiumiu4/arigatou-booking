  <path d="M120.0 17.0 L122.9 24.0 L130.5 24.6 L124.7 29.5 L126.5 36.9 L120.0 33.0 L113.5 36.9 L115.3 29.5 L109.5 24.6 L117.1 24.0 Z" fill="#f2c14e" stroke="#3a2e28" stroke-width="2.5" stroke-linejoin="round"/>
