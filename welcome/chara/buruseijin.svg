  <path d="M200.0 104.0 L203.2 111.6 L211.4 112.3 L205.1 117.7 L207.1 125.7 L200.0 121.4 L192.9 125.7 L194.9 117.7 L188.6 112.3 L196.8 111.6 Z" fill="#ffd43b" stroke="#3a2e28" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
