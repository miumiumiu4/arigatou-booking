<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="ブル星人（アンテナ2本と薄緑の体のブルエアくん）">
  <!-- 耳（ぺたんと垂れた耳） -->
  <path d="M44 50 C30 34 10 40 8 62 C8 76 20 82 30 74 C36 66 42 60 50 58 Z" fill="#a8dc8c" stroke="#3a2e28" stroke-width="5" stroke-linejoin="round"/>
  <path d="M196 50 C210 34 230 40 232 62 C232 76 220 82 210 74 C204 66 198 60 190 58 Z" fill="#a8dc8c" stroke="#3a2e28" stroke-width="5" stroke-linejoin="round"/>
  <!-- 本体（壁掛けエアコン） -->
  <rect x="22" y="40" width="196" height="132" rx="34" fill="#d4f2c4" stroke="#3a2e28" stroke-width="5"/>
  <!-- おでこのしわ -->
  <path d="M92 60 q28 -10 56 0" fill="none" stroke="#c9bfb5" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 72 q20 -7 40 0" fill="none" stroke="#c9bfb5" stroke-width="4" stroke-linecap="round"/>
