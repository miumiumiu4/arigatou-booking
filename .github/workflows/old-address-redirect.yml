name: 古い住所の転送（GitHub Pages）
# 古い住所 miumiumiu4.github.io/arigatou-booking/ を、新しい住所へ転送する看板だけを出す。
# Settings → Pages → Source を「GitHub Actions」にしてから、Actions のこの名前で Run workflow を押す。
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/old-address-redirect.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect
      - id: deploy
        uses: actions/deploy-pages@v4
